<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedra da Lua Moldes - Sugestões</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM (CDN v18) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel para rodar JSX direto no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Estilos Customizados para a Borda Gradiente -->
  <style>
    .borda-perfil-gradiente {
      padding: 4px; 
      background: linear-gradient(135deg, #8c6b99, #6b2d4b);
      border-radius: 50%;
      display: inline-block;
    }

    .borda-perfil-gradiente img {
      border-radius: 50%;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-[#f7f5f9] text-[#4a4453] font-sans antialiased selection:bg-[#e4d6ed] selection:text-[#57233c] pb-20">
  <div id="root"></div>

  <!-- Scripts do Firebase v8 (App + Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Código da Aplicação -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAJUP92sx6PKit9E1YYZppKeIhMau_X3LU",
      authDomain: "quero-moldes.firebaseapp.com",
      databaseURL: "https://quero-moldes-default-rtdb.firebaseio.com",
      projectId: "quero-moldes",
      storageBucket: "quero-moldes.firebasestorage.app",
      messagingSenderId: "466176200603",
      appId: "1:466176200603:web:285b9fc5f133aa3e79db3e",
      measurementId: "G-95793WYVPC"
    };

    let db = null;
    try {
      if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch (e) {
      console.error("Erro ao inicializar Firebase:", e);
    }

    // PRODUTOS DO PORTFÓLIO
    const INITIAL_PRODUCTS = [
      {
        id: 1,
        titulo: "Moldes PPULBATU",
        categoria: "Mundo KDrama",
        descricao: "Moldes de silicone translúcidos e de alta precisão inspirados nos mascotes adoráveis para resina.",
        imagem: "https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=500&q=80",
        url: "https://www.pedradaluamoldes.com.br"
      },
      {
        id: 2,
        titulo: "Broches Sailor Moon",
        categoria: "Portal Otaku",
        descricao: "Detalhamento minucioso para criação de broches celestiais e peças reluzentes de colecionador.",
        imagem: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=500&q=80",
        url: "https://www.pedradaluamoldes.com.br"
      },
      {
        id: 3,
        titulo: "Chaveiros & Abridores BTS",
        categoria: "Kawaii Vibes",
        descricao: "Matrizes anatômicas feitas sob medida para chaveiros duráveis e funcionais em resina epóxi.",
        imagem: "https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=500&q=80",
        url: "https://www.pedradaluamoldes.com.br"
      },
      {
        id: 4,
        titulo: "Evoluções Eevee & Co.",
        categoria: "Clube dos Baixinhos",
        descricao: "Moldes flexíveis de fácil desmolde para confecção de apliques e ornamentos encantadores.",
        imagem: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=500&q=80",
        url: "https://www.pedradaluamoldes.com.br"
      }
    ];

    // IDEIAS DE EXEMPLO FIXAS
    const INITIAL_SUGGESTIONS = [
      {
        id: 'sug-1',
        nome: 'Ana Clara',
        ideia: 'Molde de bandeja oval com moldura de lua crescente e micro estrelas em relevo!',
        whatsapp: '(11) 98765-4321',
        curtidas: 24,
        criadoEm: Date.now() - 86400000 * 2
      },
      {
        id: 'sug-2',
        nome: 'Bia Rezende',
        ideia: 'Kit de moldes para mini marcadores de página com temática de flores delicadas e prensadas.',
        whatsapp: '(21) 99887-1122',
        curtidas: 18,
        criadoEm: Date.now() - 86400000 * 4
      },
      {
        id: 'sug-3',
        nome: 'Clara Mendes',
        ideia: 'Coleção de mini casinhas estilo vilarejo mágico para porta-chaves de parede.',
        whatsapp: '(31) 97654-3344',
        curtidas: 12,
        criadoEm: Date.now() - 86400000
      }
    ];

    function App() {
      const [sugestoesLocais, setSugestoesLocais] = useState([]);
      const [exemplosFixos, setExemplosFixos] = useState(INITIAL_SUGGESTIONS);
      const [ordenacao, setOrdenacao] = useState('curtidas');
      
      const [nome, setNome] = useState('');
      const [ideia, setIdeia] = useState('');
      const [whatsapp, setWhatsapp] = useState('');
      const [enviadoSucesso, setEnviadoSucesso] = useState(false);
      const [loading, setLoading] = useState(false);

      const [isAdmin, setIsAdmin] = useState(false);
      const [senhaInput, setSenhaInput] = useState('');
      const [mostraModalAdmin, setMostraModalAdmin] = useState(false);
      const [erroSenha, setErroSenha] = useState(false);

      // LEITURA DO FIREBASE EM TEMPO REAL
      useEffect(() => {
        if (!db) return;
        const ref = db.ref('sugestoes');
        
        const listener = ref.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            const listaFirebase = Object.keys(val).map(key => ({
              id: key,
              ...val[key]
            }));
            setSugestoesLocais(listaFirebase);
          } else {
            setSugestoesLocais([]);
          }
        }, (error) => {
          console.error("Erro ao carregar do Realtime Database:", error);
        });

        return () => ref.off('value', listener);
      }, []);

      // COMBINA AS SUGESTÕES ENVIADAS COM AS DE EXEMPLO
      const todasSugestoes = [...sugestoesLocais, ...exemplosFixos];

      // CURTIR SUGESTÃO
      const handleCurtir = async (id) => {
        if (db && !id.startsWith('sug-')) {
          const itemRef = db.ref(`sugestoes/${id}/curtidas`);
          itemRef.transaction((curtidasAtuais) => (curtidasAtuais || 0) + 1);
        } else {
          setExemplosFixos(prev => prev.map(s => s.id === id ? { ...s, curtidas: s.curtidas + 1 } : s));
        }
      };

      // EXCLUIR SUGESTÃO (Apenas Modo Criador)
      const handleExcluirSugestao = async (id) => {
        if (!window.confirm("Tem certeza que deseja excluir esta sugestão?")) return;

        if (db && !id.startsWith('sug-')) {
          try {
            await db.ref(`sugestoes/${id}`).remove();
          } catch (error) {
            console.error("Erro ao excluir do Firebase:", error);
            alert("Erro ao excluir a sugestão.");
          }
        } else {
          setExemplosFixos(prev => prev.filter(s => s.id !== id));
        }
      };

      // ENVIAR SUGESTÃO
      const handleEnviarSugestao = async (e) => {
        e.preventDefault();
        if (!nome.trim() || !ideia.trim()) return;

        setLoading(true);
        try {
          if (db) {
            const novaRef = db.ref('sugestoes').push();
            await novaRef.set({
              nome: nome.trim(),
              ideia: ideia.trim(),
              whatsapp: whatsapp.trim(),
              curtidas: 0,
              criadoEm: Date.now()
            });
          }

          setNome('');
          setIdeia('');
          setWhatsapp('');
          setEnviadoSucesso(true);

          setTimeout(() => setEnviadoSucesso(false), 4000);
        } catch (error) {
          console.error("Erro ao enviar sugestão:", error);
          alert('Erro ao enviar sugestão. Verifique a conexão.');
        } finally {
          setLoading(false);
        }
      };

      // LOGIN ADMIN
      const handleLoginAdmin = (e) => {
        e.preventDefault();
        if (senhaInput === '2307') {
          setIsAdmin(true);
          setMostraModalAdmin(false);
          setSenhaInput('');
          setErroSenha(false);
        } else {
          setErroSenha(true);
        }
      };

      // ROLAGEM SUAVE COM COMPENSAÇÃO DO HEADER
const scrollToForm = () => {
  const formElement = document.getElementById('formulario-sugestao');
  if (formElement) {
    const headerOffset = 80; // compensação do cabeçalho fixo
    const elementPosition = formElement.getBoundingClientRect().top;
    const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

    window.scrollTo({
      top: offsetPosition,
      behavior: 'smooth'
    });
  }
};

      // ORDENAÇÃO
      const sugestoesOrdenadas = [...todasSugestoes].sort((a, b) => {
        if (ordenacao === 'curtidas') {
          return (b.curtidas || 0) - (a.curtidas || 0);
        }
        return (b.criadoEm || 0) - (a.criadoEm || 0);
      });

      return (
        <div className="min-h-screen bg-[#f7f5f9] text-[#4a4453] font-sans antialiased selection:bg-[#e4d6ed] selection:text-[#57233c] pb-20">
          
          <header className="sticky top-0 z-40 bg-[#f7f5f9]/90 backdrop-blur-md border-b border-[#e5deeb]">
            <div className="max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center">
              <a 
                href="https://www.pedradaluamoldes.com.br" 
                target="_blank" 
                rel="noopener noreferrer" 
                className="flex items-center gap-2 group"
              >
                <div className="w-8 h-8 rounded-full bg-[#8c6b99] flex items-center justify-center text-white shadow-sm group-hover:bg-[#6b2d4b] transition-colors">
                  🌙
                </div>
                <div className="flex flex-col">
                  <span className="font-serif font-bold text-base text-[#3b3342] leading-none group-hover:text-[#6b2d4b] transition-colors">
                    Pedra da Lua 
                  </span>
                  <span className="text-[10px] tracking-widest text-[#8c6b99] uppercase font-semibold">
                    Por: karolayne
                  </span>
                </div>
              </a>
              
              <button 
                onClick={() => isAdmin ? setIsAdmin(false) : setMostraModalAdmin(true)}
                className={`flex items-center gap-2 text-xs px-3.5 py-1.5 rounded-full border transition-all duration-200 shadow-sm ${
                  isAdmin 
                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100' 
                    : 'bg-white text-[#6b5875] border-[#dcd3e3] hover:bg-[#ede8f2] hover:text-[#3b3342]'
                }`}
              >
                {isAdmin ? '🔓 Modo Criador Ativo' : '🔒 Acesso Criador'}
              </button>
            </div>
          </header>

          <main className="max-w-3xl mx-auto px-4 pt-8 sm:pt-12 space-y-16">
            
            {/* SEÇÃO PRINCIPAL (FOTO COM BORDA GRADIENTE E APRESENTAÇÃO) */}
            <section className="text-center space-y-5">
              <div className="relative w-44 h-44 sm:w-48 sm:h-48 mx-auto flex items-center justify-center">
                <div className="borda-perfil-gradiente w-full h-full shadow-lg">
                  <img 
                    src="https://i.postimg.cc/LsyhTgWV/watermarked-img-18337851670360034752.jpg" 
                    alt="Karolayne - Pedra da Lua Moldes" 
                  />
                </div>
                <span className="absolute bottom-1 right-1 bg-[#6b2d4b] text-white p-1.5 rounded-full shadow-md text-xs border-2 border-white">
                  💜
                </span>
              </div>

              <div className="space-y-2">
                <span className="text-xs uppercase tracking-widest text-[#8c6b99] font-bold bg-[#ede8f2] px-3 py-1 rounded-full border border-[#e0d6e8]">
                  Karolayne
                </span>
                <h1 className="text-lg font-serif text-[#3b3342] pt-1 leading-snug">
                  Criadora da Pedra da Lua Moldes — que ama transformar ideias lúdicas em moldes de alta performance. 🌙✨
                </h1>
              </div>

              <p className="text-base text-[#6c5e75] max-w-md mx-auto leading-relaxed">
                Esta é a agenda de ideias da PDL: um cantinho para você anotar o molde dos seus sonhos! E apoiar outras ideias criativas. 
              </p>
              
              <div className="flex justify-center gap-3 pt-2">
                <button 
                  onClick={scrollToForm}
                  className="inline-flex items-center gap-2 bg-[#6b2d4b] hover:bg-[#57233c] text-white text-xs font-semibold px-5 py-3 rounded-full shadow-md transition-all hover:-translate-y-0.5 active:scale-95"
                >
                  💡 <span>Sugerir um molde</span>
                </button>
              </div>
            </section>

            {/* MURAL DE IDÉIAS E VOTAÇÃO */}
            <section className="space-y-6">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-3 border-b border-[#e5deeb] pb-3">
                <div>
                  <span className="text-[18px] uppercase tracking-widest text-[#8c6b99] font-bold">
                    Agenda mágica do artesão
                  </span>
                  <h2 className="text-xl font-serif text-[#3b3342]">Uma ideia que pode virar realidade</h2>
                </div>

                <div className="flex items-center gap-2 text-xs bg-white px-3 py-1.5 rounded-xl border border-[#dcd3e3] shadow-sm">
                  <span className="text-[#6c5e75]">Ordenar:</span>
                  <select 
                    value={ordenacao}
                    onChange={(e) => setOrdenacao(e.target.value)}
                    className="bg-transparent font-semibold text-[#3b3342] outline-none cursor-pointer"
                  >
                    <option value="curtidas">Mais curtidas 🔥</option>
                    <option value="recentes">Mais recentes ✨</option>
                  </select>
                </div>
              </div>

              <div className="grid sm:grid-cols-2 gap-4">
                {sugestoesOrdenadas.map((item) => (
                  <div 
                    key={item.id} 
                    className="bg-white rounded-2xl p-5 shadow-sm border border-[#ede8f2] flex flex-col justify-between space-y-4 hover:border-[#dcd3e3] transition-colors"
                  >
                    <div className="space-y-2.5">
                      <div className="flex justify-between items-center gap-2">
                        <span className="font-semibold text-xs text-[#3b3342] bg-[#f7f5f9] px-2.5 py-1 rounded-lg border border-[#e5deeb]">
                          {item.nome}
                        </span>
                        
                        <div className="flex items-center gap-1.5">
                          {isAdmin && item.whatsapp && (
                            <span className="text-[10px] font-mono bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-200 font-semibold">
                              WhatsApp: {item.whatsapp}
                            </span>
                          )}

                          {/* BOTÃO DE EXCLUIR (Apenas no Modo Criador) */}
                          {isAdmin && (
                            <button
                              type="button"
                              onClick={() => handleExcluirSugestao(item.id)}
                              className="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-2 py-0.5 rounded-lg font-semibold transition-colors flex items-center justify-center cursor-pointer"
                              title="Excluir sugestão"
                            >
                              🗑️
                            </button>
                          )}
                        </div>
                      </div>

                      <p className="text-xs text-[#52465c] leading-relaxed">
                        "{item.ideia}"
                      </p>
                    </div>

                    <div className="pt-2 flex justify-between items-center border-t border-[#f5f1f8]">
                      <button
                        onClick={() => handleCurtir(item.id)}
                        className="flex items-center gap-1.5 bg-[#fbf8fd] hover:bg-[#f3ebf7] border border-[#e8dbe8] text-[#6b2d4b] font-medium text-xs px-3.5 py-1.5 rounded-full transition-all active:scale-95 shadow-sm"
                      >
                        ❤️ <span>{item.curtidas || 0}</span>
                      </button>

                      <span className="text-[10px] text-[#a193ab]">
                        {item.criadoEm ? new Date(item.criadoEm).toLocaleDateString('pt-BR') : 'Recentemente'}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* FORMULÁRIO DE ENVIAR SUGESTÃO */}
            <section id="formulario-sugestao" className="scroll-mt-24 bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-[#eae3ef] space-y-6 relative overflow-hidden">
              <div className="text-center space-y-1.5 relative z-10">
                <span className="text-[11px] uppercase tracking-widest text-[#8c6b99] font-bold">
                  Sua ideia é o caminho para criação
                </span>
                <h2 className="text-2xl font-serif text-[#3b3342]">Qual molde você precisa?</h2>
                <p className="text-xs text-[#6c5e75] max-w-sm mx-auto">
                  Essa é a unica forma para criação de molde comigo, a Pedra da Lua não aceita mais pedidos personalizados!
                </p>
              </div>

              {enviadoSucesso && (
                <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 p-3.5 rounded-xl text-xs flex items-center gap-2 max-w-md mx-auto">
                  <span>✨ Sua sugestão foi enviada e salva no mural com sucesso!</span>
                </div>
              )}

              <form onSubmit={handleEnviarSugestao} className="space-y-4 max-w-md mx-auto relative z-10">
                <div className="space-y-1.5">
                  <label className="text-xs font-semibold text-[#52465c]">Seu Nome</label>
                  <input
                    type="text"
                    required
                    value={nome}
                    onChange={(e) => setNome(e.target.value)}
                    placeholder="Ex: Karolayne"
                    className="w-full bg-[#fcfbfe] border border-[#dcd3e3] rounded-xl px-3.5 py-2.5 text-xs text-[#3b3342] outline-none focus:border-[#8c6b99] focus:bg-white transition-all shadow-sm"
                  />
                </div>

                <div className="space-y-1.5">
                  <label className="text-xs font-semibold text-[#52465c]">Sua ideia de molde</label>
                  <textarea
                    required
                    rows={3}
                    value={ideia}
                    onChange={(e) => setIdeia(e.target.value)}
                    placeholder="Descreva livremente sua sugestão (ex: Uma Lua, delicada para bandeja de resina/gesso/velas) fale o formato/tema e a funcionalidade desejada..."
                    className="w-full bg-[#fcfbfe] border border-[#dcd3e3] rounded-xl px-3.5 py-2.5 text-xs text-[#3b3342] outline-none focus:border-[#8c6b99] focus:bg-white transition-all resize-none shadow-sm"
                  />
                </div>

                <div className="space-y-1.5">
                  <label className="text-xs font-semibold text-[#52465c]"> WhatsApp (Opcional e não ficará visivel. Só será utilizado para o aviso de lançamento com a sua ideia!)</label>
                  <input
                    type="tel"
                    value={whatsapp}
                    onChange={(e) => setWhatsapp(e.target.value)}
                    placeholder="(00) 00000-0000"
                    className="w-full bg-[#fcfbfe] border border-[#dcd3e3] rounded-xl px-3.5 py-2.5 text-xs text-[#3b3342] outline-none focus:border-[#8c6b99] focus:bg-white transition-all shadow-sm"
                  />
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full bg-[#6b2d4b] hover:bg-[#57233c] text-white text-xs font-semibold py-3 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 active:scale-[0.99]"
                >
                  {loading ? 'Enviando...' : 'Enviar sugestão'}
                </button>
              </form>
            </section>

            {/* PORTFÓLIO DE COLEÇÕES (POSICIONADO NO FIM DA PÁGINA) */}
            <section className="space-y-5 pt-4">
              <div className="flex justify-between items-end border-b border-[#e5deeb] pb-3">
                <div>
                  <span className="text-[11px] uppercase tracking-widest text-[#8c6b99] font-bold">
                    Um pouco do meu portfólio
                  </span>
                  <h2 className="text-xl font-serif text-[#3b3342]">Coleções lançadas</h2>
                </div>
                <a 
                  href="https://www.pedradaluamoldes.com.br" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="text-xs text-[#6b2d4b] hover:underline flex items-center gap-1 font-semibold"
                >
                  <span>Ver loja completa &rarr;</span>
                </a>
              </div>

              <div className="flex gap-4 overflow-x-auto pb-4 pt-1 snap-x scrollbar-thin">
                {INITIAL_PRODUCTS.map((prod) => (
                  <div 
                    key={prod.id} 
                    className="min-w-[240px] sm:min-w-[260px] max-w-[260px] bg-white rounded-2xl p-3.5 border border-[#ede8f2] shadow-sm flex flex-col justify-between snap-start hover:shadow-md transition-shadow"
                  >
                    <div className="space-y-3">
                      <div className="h-36 rounded-xl bg-[#f5f1f8] overflow-hidden relative group">
                        <img 
                          src={prod.imagem} 
                          alt={prod.titulo} 
                          className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                        />
                        <span className="absolute top-2 left-2 bg-white/95 backdrop-blur-sm text-[10px] text-[#57233c] font-bold px-2.5 py-0.5 rounded-full shadow-sm">
                          {prod.categoria}
                        </span>
                      </div>
                      <div className="space-y-1">
                        <h3 className="text-xs font-bold text-[#3b3342]">{prod.titulo}</h3>
                        <p className="text-[11px] text-[#6c5e75] leading-relaxed line-clamp-2">
                          {prod.descricao}
                        </p>
                      </div>
                    </div>

                    <a 
                      href={prod.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="mt-4 text-[11px] font-semibold text-[#6b2d4b] hover:text-[#57233c] bg-[#fbf5f8] hover:bg-[#f5e9f0] border border-[#f0e2ea] py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-colors"
                    >
                      <span>Ver no site</span>
                    </a>
                  </div>
                ))}
              </div>
            </section>

          </main>

          {/* MODAL DE AUTENTICAÇÃO DO CRIADOR */}
          {mostraModalAdmin && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-xs w-full space-y-4 shadow-xl border border-[#e5deeb]">
                <h3 className="text-sm font-bold text-[#3b3342]">Acesso Criador</h3>
                <form onSubmit={handleLoginAdmin} className="space-y-3">
                  <input
                    type="password"
                    placeholder="Senha"
                    value={senhaInput}
                    onChange={(e) => setSenhaInput(e.target.value)}
                    className="w-full border border-[#dcd3e3] rounded-lg px-3 py-2 text-xs outline-none focus:border-[#8c6b99]"
                  />
                  {erroSenha && <p className="text-[11px] text-red-500">Senha incorreta!</p>}
                  <div className="flex justify-end gap-2 pt-1">
                    <button 
                      type="button" 
                      onClick={() => setMostraModalAdmin(false)} 
                      className="px-3 py-1.5 text-xs text-[#6c5e75] hover:bg-[#f5f1f8] rounded-lg"
                    >
                      Cancelar
                    </button>
                    <button 
                      type="submit" 
                      className="px-3 py-1.5 text-xs bg-[#8c6b99] text-white rounded-lg hover:bg-[#6b2d4b]"
                    >
                      Entrar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
